<!doctype html>
<html lang="fa" dir="rtl">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>TempMail</title>
		<meta name="description" content="ساخت و مدیریت ایمیل موقت و دائمی، همگام با ربات تلگرام" />
		<meta name="theme-color" content="#191919" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232783DE'/%3E%3Cpath d='M7 11.5h18v9.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 7 21z' fill='white'/%3E%3Cpath d='M7.5 12 16 18l8.5-6' stroke='%232783DE' stroke-width='1.6' fill='none'/%3E%3C/svg%3E" />
		<link rel="stylesheet" href="/app.css" />
	</head>
	<body>
		<!-- THREE.JS BACKGROUND -->
		<div id="bg-canvas"></div>

		<header class="topbar">
			<div class="brand">
				<span class="brand-mark" aria-hidden="true">
					<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
						<rect x="2.5" y="5" width="19" height="14" rx="3" />
						<path d="M3 7l9 6 9-6" />
					</svg>
				</span>
				<span>TempMail</span>
			</div>
			<button id="logout" class="ghost hidden" type="button">خروج</button>
		</header>

		<main id="main">
			<!-- LOGIN -->
			<section id="view-login" class="view">
				<div class="card center glass">
					<h1>ورود با کد تلگرام</h1>
					<p class="muted">
						در ربات تلگرام دستور <b>/web</b> را بفرستید و کد شش‌رقمی را اینجا وارد کنید.
						حساب وب و ربات یکی است.
					</p>
					<form id="login-form" autocomplete="off">
						<label class="sr-only" for="code">کد ورود</label>
						<input
							id="code"
							name="code"
							class="code-input"
							inputmode="numeric"
							pattern="[0-9]*"
							maxlength="6"
							placeholder="------"
							required
						/>
						<button class="primary block" type="submit">ورود</button>
					</form>
					<p id="login-error" class="error hidden"></p>
					<a id="bot-link" class="muted small" href="https://t.me" target="_blank" rel="noopener">باز کردن ربات تلگرام</a>
				</div>
			</section>

			<!-- APP -->
			<section id="view-app" class="view hidden">
				<div class="card address-card glass">
					<div class="row between">
						<span class="label">آدرس فعال</span>
						<span id="active-ttl" class="pill">—</span>
					</div>
					<div class="row between gap">
						<code id="active-address" dir="ltr">—</code>
						<button id="copy-active" class="ghost icon" type="button" title="کپی">کپی</button>
					</div>
					<div class="row gap wrap">
						<button id="new-temp" class="primary" type="button">آدرس موقت جدید</button>
						<button id="new-perm" class="secondary" type="button">آدرس دائمی</button>
					</div>
					<p id="quota" class="muted small">—</p>
				</div>

				<nav class="tabs glass" role="tablist">
					<button class="tab active" data-tab="inbox" role="tab" type="button">صندوق</button>
					<button class="tab" data-tab="addresses" role="tab" type="button">آدرس‌ها</button>
					<button class="tab" data-tab="settings" role="tab" type="button">تنطیمات</button>
				</nav>

				<div id="tab-inbox" class="tabpanel">
					<div class="row between">
						<span class="label">ایمیل‌های اخیر</span>
						<button id="refresh" class="ghost small" type="button">به‌روزرسانی</button>
					</div>
					<ul id="inbox-list" class="list"></ul>
					<p id="inbox-empty" class="empty hidden">هنوز ایمیلی نرسیده. صفحه هر ۲۰ ثانیه خودش بررسی می‌کند.</p>
				</div>

				<div id="tab-addresses" class="tabpanel hidden">
					<span class="label">آدرس‌های من</span>
					<ul id="address-list" class="list"></ul>
				</div>

				<div id="tab-settings" class="tabpanel hidden">
					<span class="label">تنطیمات</span>
					<label class="switch-row glass">
						<span>اعلان تلگرام برای ایمیل جدید</span>
						<input id="set-notify" type="checkbox" />
					</label>
					<label class="switch-row glass">
						<span>نمایش لینک‌های داخل ایمیل</span>
						<input id="set-links" type="checkbox" />
					</label>
					<p class="muted small" id="account-line">—</p>
				</div>
			</section>
		</main>

		<!-- MESSAGE SHEET -->
		<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="sheet-subject">
			<div class="sheet-inner glass">
				<div class="row between">
					<h2 id="sheet-subject">—</h2>
					<button id="sheet-close" class="ghost icon" type="button" aria-label="بستن">✕</button>
				</div>
				<p id="sheet-meta" class="muted small" dir="ltr"></p>
				<pre id="sheet-body" dir="auto"></pre>
			</div>
		</div>

		<div id="toast" class="toast hidden"></div>
		
		<!-- Three.js -->
		<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
		<script src="/3d-bg.js"></script>
		<script src="/app.js"></script>
	</body>
</html>
