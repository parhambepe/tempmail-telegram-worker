name = "tempmail-bot"
main = "src/index.js"
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
# Domain configured in Cloudflare Email Routing (catch-all -> this worker).
MAIL_DOMAIN = "example.com"
# Bot username without @ (used for referral links).
BOT_USERNAME = "your_bot"
# Lifetime of a temporary address, in seconds.
TEMP_TTL_SECONDS = "86400"
# Free permanent addresses per user.
MAX_PERM_ADDRESSES = "3"
# Optional: public URL of the web UI shown by /web. Defaults to the worker URL.
# WEB_URL = "https://mail.example.com"

# Web UI (public/) served as static assets by the same worker.
[assets]
directory = "./public"
binding = "ASSETS"
# The worker runs first for these paths so the API and webhook are never
# shadowed by a static file.
run_worker_first = ["/api/*", "/webhook", "/init"]

[[kv_namespaces]]
binding = "MAILBOX"
id = "PUT_YOUR_KV_NAMESPACE_ID_HERE"

# Secrets (set with `npx wrangler secret put <NAME>` or in the dashboard):
#   BOT_TOKEN, WEBHOOK_SECRET, SETUP_TOKEN, ADMIN_ID
